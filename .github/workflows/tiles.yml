# Builds the tiles and uploads them to R2.
# Weekly: venues and terraces. Yearly: buildings and communes (run it by hand too when
# cities.json gains an area). Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_BUCKET. Public repo, standard runner: no minutes are billed.
name: Tiles

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
    - cron: "41 4 2 1 *"   # 2 January 04:41 UTC
  workflow_dispatch:
    inputs:
      layers:
        description: "Layers to build (comma-separated)"
        default: "terraces-v2,venues"
      repo_tiles:
        description: "Skip the build and upload the tiles committed in this repository (built on the Mac: districts, Tel Aviv, whose heights feed answers only from Israel)"
        type: boolean
        default: false

concurrency:
  group: tiles
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq osmium-tool
      # Capped below the job's limit so a long build (Spain's cadastre answers slowly) still
      # reaches the upload with every cell it finished; a cell not finished keeps its last tile.
      - name: Build
        if: ${{ !inputs.repo_tiles }}
        env:
          LAYERS: ${{ inputs.layers || (github.event.schedule == '41 4 2 1 *' && 'buildings,communes' || 'terraces-v2,venues') }}
        run: timeout 330m python3 make_tiles.py --cities cities.json --out out --layers "$LAYERS" --block 5 || true
      # The coverage feed the site's map reads: this run's cells merged into the published feed.
      - name: Coverage
        if: ${{ !cancelled() }}
        continue-on-error: true   # a failed merge must never stop the tiles from reaching R2
        run: python3 coverage.py --out ${{ inputs.repo_tiles && 'tiles' || 'out' }} --cities cities.json --previous "https://pub-c7dde6811086418585889c3e30cf9880.r2.dev/coverage.json" --write out-coverage.json
      # Lets the site read coverage.json and cities.json from a browser. Idempotent.
      - name: Bucket CORS
        if: ${{ !cancelled() }}
        continue-on-error: true   # a token without bucket-admin rights fails here; the upload still runs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3api put-bucket-cors --bucket "${{ secrets.R2_BUCKET }}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --cors-configuration '{"CORSRules":[{"AllowedOrigins":["https://techneb.github.io","https://claude.ai"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":86400}]}'
      # Uploaded even when the build exits non-zero: a failed cell leaves no file, so what is
      # there is complete, and R2 keeps last week's tile for the rest.
      - name: Upload to R2
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Gzipped at rest and served with Content-Encoding: the phone's URLSession inflates it.
          if [ "${{ inputs.repo_tiles }}" = "true" ]; then rm -rf out && cp -R tiles out; fi
          find out -name '*.json' -print0 | xargs -0 -P4 -n200 gzip -9n
          find out -name '*.json.gz' | while read -r f; do mv "$f" "${f%.gz}"; done
          aws s3 cp out "s3://${{ secrets.R2_BUCKET }}/tiles/" --recursive --only-show-errors \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json --content-encoding gzip --cache-control "public, max-age=86400"
          # The app reads config.json at the store's root once a launch (sunnyFilter, minimumVersion).
          aws s3 cp config.json "s3://${{ secrets.R2_BUCKET }}/config.json" --only-show-errors \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=3600"
          # The coverage feed and the areas behind it, plain JSON for the site's map.
          [ -f out-coverage.json ] && aws s3 cp out-coverage.json "s3://${{ secrets.R2_BUCKET }}/coverage.json" --only-show-errors \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=300"
          aws s3 cp cities.json "s3://${{ secrets.R2_BUCKET }}/cities.json" --only-show-errors \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=300"
