# Runners pinned to ubuntu-24.04: ubuntu-latest moves to 26.04 from 2026-10-19 and the multi-hour builds must not change OS under us.
# Builds the tiles and uploads them to R2, one job per city in parallel, then one job merges the
# coverage feed. Weekly: venues and terraces. Yearly: buildings and the street layers (run it by hand too when cities.json
# gains an area). transit/ (2026-10-13) on dispatch only. streets, streets-main, places, boundaries and transit are built only for the areas whose entry says "streets": true;
# numbers/ (house-number ranges) is written beside streets/ by the same build and uploaded with it. French builds compute communes (out/communes/) to pick a permit feed by INSEE code and
# to name the feed's areas; they are never uploaded (2026-10-03: the app credits from sources/).
# boundaries/ (neighbourhood outlines, 2026-10-10) needs shapely, pyproj and pyshp (requirements.txt), installed only when asked.
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET; STOCKHOLM_API_KEY and LINZ_API_KEY (the build step only). Public repo, standard
# runners: no minutes are billed. Only the tiles whose bytes differ from the store's (by ETag) are
# uploaded; a numbers/ or boundaries/ tile the store holds for a cell the run left with none is deleted (only those two
# layers, only in the city's own cells); dry_run builds and prints that plan without writing anything. Buildings are built
# only for the cells near a venue or terrace (BUILDINGS.md); the weekly run builds those a new venue or terrace reaches, and,
# dispatched with prune_buildings, deletes the buildings-v2/ tiles of the cells none reaches.
name: Tiles

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
    - cron: "41 4 2 1 *"   # 2 January 04:41 UTC
  workflow_dispatch:
    inputs:
      layers:
        description: "Layers to build (comma-separated; streets, streets-main, places and boundaries only where cities.json flags \"streets\": true); sources alone restores the building source of the published sources/ tiles that lack it"
        default: "terraces-v2,venues"
      repo_tiles:
        description: "Skip the build and upload the tiles committed in this repository (built off GitHub, such as Tel Aviv, whose heights feed answers only from Israel)"
        type: boolean
        default: false
      only:
        description: "Build only these cities (comma-separated city names as in cities.json); empty = all"
        default: ""
      dry_run:
        description: "Build and print what would be uploaded (new, changed, unchanged per layer); write nothing to R2 or the repository"
        type: boolean
        default: false
      prune_buildings:
        description: "With terraces-v2: also delete the buildings-v2/ tiles of the cells no venue or terrace reaches (owner-approved; dry_run first)"
        type: boolean
        default: false

# One run at a time, whatever the branch: the feed job merges into the published coverage.json and must not race another run.
concurrency:
  group: tiles
  cancel-in-progress: false

permissions:
  contents: read
  actions: read     # the feed job reads this run's build jobs for stats.json

env:
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  # The repo's test scripts first (tests.yml): a red test stops the run before anything is built or uploaded.
  tests:
    uses: ./.github/workflows/tests.yml

  # Which cities, one matrix entry per city name (a city with several entries, like Paris, is one job).
  plan:
    needs: tests
    runs-on: ubuntu-24.04
    outputs:
      cities: ${{ steps.plan.outputs.cities }}
      # GitHub expands at most 256 jobs from one matrix: the build splits in two, build (255) and build_b (the rest).
      cities_a: ${{ steps.plan.outputs.cities_a }}
      cities_b: ${{ steps.plan.outputs.cities_b }}
      layers: ${{ steps.plan.outputs.layers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          LAYERS: ${{ inputs.layers || (github.event.schedule == '41 4 2 1 *' && 'buildings,streets,streets-main,places,boundaries' || 'terraces-v2,venues') }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          from make_tiles import LAYERS
          # make_tiles.py refuses an unknown layer too: caught here, no job downloads an extract to build nothing.
          unknown = [l for l in os.environ["LAYERS"].split(",") if l not in LAYERS + ("sources",)]
          if unknown: sys.exit(f"unknown layer {', '.join(map(repr, unknown))}: give {', '.join(LAYERS)} or sources (numbers comes with streets)")
          only = [c.strip() for c in os.environ.get("ONLY", "").split(",") if c.strip()]
          entries = json.load(open("cities.json"))
          missing = [c for c in only if c not in {e["city"] for e in entries}]
          if missing: sys.exit(f"not in cities.json: {', '.join(map(repr, missing))}")
          # A run of the street layers alone has nothing to do for a city with no flagged entry: no job for it.
          streets_only = {l.strip() for l in os.environ["LAYERS"].split(",") if l.strip()} <= {"streets", "streets-main", "places", "boundaries", "transit"}
          names = []
          for e in entries:
              if streets_only and e.get("streets") is not True: continue
              if (not only or e["city"] in only) and e["city"] not in names: names.append(e["city"])
          print("cities=" + json.dumps(names))
          print("cities_a=" + json.dumps(names[:255]))
          print("cities_b=" + json.dumps(names[255:]))
          print("layers=" + os.environ["LAYERS"])
          PY

  # The store's keys and ETags under every layer this run writes, listed once for all the cities
  # (one Class A request per 1,000 keys). If the listing fails, the build jobs upload every tile.
  remote:
    needs: plan
    if: ${{ !inputs.repo_tiles && needs.plan.outputs.cities != '[]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: List the store
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LAYERS: ${{ needs.plan.outputs.layers }}
        run: |
          # sources/ is written beside the layers asked for, numbers/ beside streets/ (2026-10-10); the store holds buildings-v2/
          # for buildings (2026-10-08); communes/ is never uploaded, so not listed.
          # A terraces-v2 run lists buildings-v2/ too: it builds the buildings of the cells a new venue or terrace reaches.
          layers=$(echo "$LAYERS,sources" | sed 's/terraces-v2/terraces-v2,buildings/' | tr ',' '\n' | grep -vx communes | sed 's/^buildings$/buildings-v2/; s/^streets$/streets\nnumbers/' | sort -u | tr '\n' ' ')
          pids=""
          for l in $layers; do
            aws s3api list-objects-v2 --bucket "${{ secrets.R2_BUCKET }}" --prefix "tiles/$l/" --endpoint-url "$ENDPOINT" \
              --query 'Contents[].[Key,ETag]' --output text > "remote-$l.tsv" & pids="$pids $!"
          done
          for p in $pids; do wait "$p"; done
          cat remote-*.tsv > remote.tsv
          n=$(grep -c . remote.tsv || true)
          echo "Listed $n keys under: $layers (about $(( n / 1000 + $(echo $layers | wc -w) )) list requests)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ hashFiles('remote.tsv') != '' }}
        with:
          name: remote
          path: remote.tsv
          retention-days: 1

  build:
    needs: [plan, remote]
    if: ${{ !inputs.repo_tiles && needs.plan.outputs.cities != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        city: ${{ fromJson(needs.plan.outputs.cities_a) }}
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Capped and retried: on 2026-10-26 apt-get update hung on a stalled mirror until the job's 350-minute timeout (Phoenix).
      - run: for i in 1 2 3; do timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update -q && timeout 600 sudo apt-get install -yq osmium-tool && break; [ $i = 3 ] && exit 1; sleep 30; done
      # boundaries/ alone needs packages (shapely ≥ 2.1 for coverage_simplify); in the user's site, the system's Python left as it is.
      - if: ${{ contains(format(',{0},', needs.plan.outputs.layers), ',boundaries,') }}
        run: python3 -m pip install --user --break-system-packages -q -r requirements.txt
      # The store's listing, read twice: the build starts with the blocks the store lacks, the upload compares with it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: remote
      # --store: a sources/ tile keeps the published tile's field this run does not build (a terraces run
      # keeps "buildings", a buildings run "permits"), read from the store's public host (no credentials).
      # Capped below the job's limit so a long build (Spain's cadastre answers slowly) still
      # reaches the upload with every cell it finished; a cell not finished keeps its last tile.
      - name: Build ${{ matrix.city }}
        id: build
        env:
          CITY: ${{ matrix.city }}
          LAYERS: ${{ needs.plan.outputs.layers }}
          STOCKHOLM_API_KEY: ${{ secrets.STOCKHOLM_API_KEY }}   # Stockholm's permit WFS; unset, the row is skipped
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}             # Auckland's suburbs (boundaries/); unset, Auckland gets none
        run: |
          python3 -c 'import json,os; cities=json.load(open("cities.json")); json.dump([c for c in cities if c["city"]==os.environ["CITY"]], open("cities-run.json","w"))'
          timeout 290m python3 make_tiles.py --cities cities-run.json --out out --layers "$LAYERS" --block 5 --unshaded unshaded.txt \
            --store "https://tiles.alephb.uk/tiles/" $([ -f remote.tsv ] && echo --listing remote.tsv) || echo "status=$?" >> "$GITHUB_OUTPUT"   # checked after the upload
      # This city's cells for the feed, merged by the feed job below (small; the tiles stay here), handed over after the upload.
      # continue-on-error so the tiles still go up; the job turns red at its end (Check the feed fragment).
      - name: Coverage fragment
        id: fragment
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CITY: ${{ matrix.city }}   # transit/ tiles are this city's (coverage.py)
        run: python3 coverage.py --out out --cities cities.json --previous "https://tiles.alephb.uk/coverage.json" --fragment fragment.json
      # Gzipped at rest and served with Content-Encoding: the phone's URLSession inflates it.
      # -n leaves out the name and time, so an unchanged tile gzips to the same bytes.
      # Compared with the store's ETags: only new and changed tiles are kept for the upload.
      # communes/ and buildings/ leave out/ first: the coverage fragment above has read them, and they are never
      # uploaded (the app reads buildings-v2/; the old layer left the store on 2026-10-08).
      - name: Compare with the store
        if: ${{ !cancelled() }}
        env:
          CITY: ${{ matrix.city }}
          PRUNE: ${{ !inputs.dry_run && '--prune' || '' }}
          UNSHADED: ${{ inputs.prune_buildings && '--unshaded unshaded.txt' || '' }}
        run: |
          [ -d out ] || exit 0
          rm -rf out/communes out/buildings
          find out -name '*.json' -print0 | xargs -0 -P4 -n200 gzip -9n
          find out -name '*.json.gz' | while read -r f; do mv "$f" "${f%.gz}"; done
          echo "### $CITY" >> "$GITHUB_STEP_SUMMARY"
          [ -f remote.tsv ] || echo "No listing of the store: every tile is uploaded." | tee -a "$GITHUB_STEP_SUMMARY"
          python3 changed.py --listing remote.tsv --out out $PRUNE --summary "$GITHUB_STEP_SUMMARY" --cities cities.json --city "$CITY" --stale stale.txt $UNSHADED
      # A dry run keeps the keys it would delete (stale.txt), for the prune's counts and sizes (2026-10-14).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.dry_run && !cancelled() && hashFiles('stale.txt') != '' }}
        continue-on-error: true
        with:
          name: stale-${{ github.job == 'build_b' && 'b-' || '' }}${{ strategy.job-index }}
          path: stale.txt
          retention-days: 7
      # Uploaded even when the build exits non-zero or hits its time cap (the build step records the status and
      # succeeds): a failed cell leaves no file, so what is there is complete, and R2 keeps last week's tile for the rest.
      # Never after a failed step (success() implied): a gzip cut short would leave plain JSON in out/, stored as gzip.
      - name: Upload tiles to R2
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2 answers ServiceUnavailable ("Reduce your concurrent request rate") to a few PUTs of a big city
          # (New York 1, Istanbul 2 of ~60,000 on 2026-10-03): adaptive retries back off instead of failing them.
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: "10"
        run: |
          [ -d out ] || exit 0
          # Tens of thousands of small files (Paris, 2026-09-28: over 20 min at the default 10): more in flight; 32, not 64, since R2 throttled single PUTs at 64 (2026-10-03, -05).
          aws configure set default.s3.max_concurrent_requests 32
          up() { aws s3 cp "$@" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --content-encoding gzip --cache-control "public, max-age=86400"; }
          # Even with retries R2 still refuses a few PUTs (Edinburgh 1, Rome 1, Buenos Aires 2 on 2026-10-05):
          # those files alone go up again, one at a time; anything else still fails the step.
          up out "s3://${{ secrets.R2_BUCKET }}/tiles/" --recursive > upload.log 2>&1 && exit 0
          cat upload.log
          grep -q '^upload failed: out/' upload.log || exit 1
          grep -v '^upload failed: out/' upload.log | grep -q . && exit 1
          sed -n 's/^upload failed: \(out\/[^ ]*\) to .*/\1/p' upload.log | while read -r f; do
            sleep 2; up "$f" "s3://${{ secrets.R2_BUCKET }}/tiles/${f#out/}" || exit 1
          done
      # The fragment only once the tiles are up: a failed upload must not date the city's cells today in coverage.json.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.dry_run && hashFiles('fragment.json') != '' }}
        continue-on-error: true   # a lost fragment must not hold back the rest
        with:
          name: fragment-${{ github.job == 'build_b' && 'b-' || '' }}${{ strategy.job-index }}
          path: fragment.json
          retention-days: 3
      # numbers/ and boundaries/ write no file for a cell left with nothing: the keys of the city's own cells this run
      # emptied (changed.py --stale, listed in the summary above, a dry run included) go from the store, those two layers only.
      # With prune_buildings, also the buildings-v2/ tiles of the city's own cells no venue or terrace reaches (owner, 2026-10-13).
      - name: Delete emptied tiles from R2
        if: ${{ !inputs.dry_run && hashFiles('stale.txt') != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          split -l 1000 stale.txt stale-
          for b in stale-??; do
            python3 -c 'import json,sys; print(json.dumps({"Objects":[{"Key":k.strip()} for k in open(sys.argv[1]) if k.strip()],"Quiet":True}))' "$b" > "$b.json"
            # Quiet: only the keys that failed come back, and any fails the step.
            aws s3api delete-objects --bucket "${{ secrets.R2_BUCKET }}" --delete "file://$b.json" --endpoint-url "$ENDPOINT" --output json > "$b.out"
            python3 -c 'import json,sys; t=open(sys.argv[1]).read().strip(); e=json.loads(t).get("Errors") if t else None; sys.exit(f"{len(e)} not deleted: {e[:5]}" if e else 0)' "$b.out"
          done
          echo "Deleted $(wc -l < stale.txt) emptied numbers/, boundaries/ and unshaded buildings-v2/ tiles." >> "$GITHUB_STEP_SUMMARY"
      # Three of the tiles just uploaded, read back through tiles.alephb.uk as the app reads them: 200, gzip, JSON, not empty (the host refuses urllib's own User-Agent)
      # (2026-10-28, the app repo's TEST_PLAN B2). The query string makes the edge fetch from R2, past a cached 404.
      - name: Smoke-read uploaded tiles
        if: ${{ !inputs.dry_run && success() }}   # after the fragment and the deletes: a failed read must not hold them back
        timeout-minutes: 5
        env:
          RUN: ${{ github.run_id }}
        run: |
          [ -d out ] || exit 0
          python3 - $(find out -type f -name '*.json' | shuf -n 3) <<'PY'
          import gzip, json, os, sys, urllib.request
          if len(sys.argv) == 1: sys.exit(print("Nothing uploaded: no smoke read."))
          bad = []
          for f in sys.argv[1:]:
              url = f"https://tiles.alephb.uk/tiles/{f.removeprefix('out/')}?smoke={os.environ['RUN']}"
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"Accept-Encoding": "gzip", "User-Agent": "compromise-tiles"}), timeout=30)
                  enc, body = r.headers.get("Content-Encoding"), r.read()
                  if enc != "gzip": bad.append(f"{url}: Content-Encoding {enc}")
                  elif not json.loads(gzip.decompress(body)): bad.append(f"{url}: empty JSON")
                  else: print(f"ok {url}")
              except Exception as e: bad.append(f"{url}: {e}")
          for b in bad: print(f"::error title=Smoke read failed::{b}")
          sys.exit(1 if bad else 0)
          PY
      # Red once what was built is up: more than 5 % of the city's cells failed (make_tiles.py exits 1),
      # or the time cap cut the build (124). A green job used to hide both (Gijón, Genoa, London, 2026-10-07).
      - name: Check the build is complete
        if: ${{ !cancelled() && steps.build.outputs.status != '' }}
        env:
          CITY: ${{ matrix.city }}
          STATUS: ${{ steps.build.outputs.status }}
        run: |
          if [ "$STATUS" = 124 ]; then why="stopped by the 290-minute cap: the cells it did not reach keep their last tile"
          else why="more than 5 % of its cells failed (exit $STATUS): see Failures in the build step"; fi
          echo "### ❌ $CITY: $why" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$CITY is short::$why"
          exit 1

      # A failed fragment drops the city's record from the feed: red, not green (Aix-en-Provence, 2026-10-17).
      - name: Check the feed fragment
        if: ${{ !cancelled() && steps.fragment.outcome == 'failure' }}
        env:
          CITY: ${{ matrix.city }}
        run: |
          echo "### ❌ $CITY: no feed fragment, its record is not in coverage.json: see Coverage fragment; run the city again" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$CITY has no feed record::the Coverage fragment step failed"
          exit 1

  # The cities past the first 255 (GitHub's matrix cap), same steps; named `build (<city>)` too, for stats.py.
  build_b:
    name: build (${{ matrix.city }})
    needs: [plan, remote]
    if: ${{ !inputs.repo_tiles && needs.plan.outputs.cities_b != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        city: ${{ fromJson(needs.plan.outputs.cities_b) }}
    steps: *build-steps

  # The tiles committed in this repository for the cities built off GitHub, uploaded as they are, with their feed fragment.
  repo_upload:
    needs: plan
    if: ${{ inputs.repo_tiles && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only buildings/ (converted to buildings-v2/), only in the cells of the cities built off GitHub (storage.py's owners):
      # the other layers under tiles/ are old snapshots of what the weekly build makes, and would overwrite its fresh tiles.
      # buildings-v2/ before the fragment: coverage.py counts that layer only.
      - env:
          REPO_CITIES: Tel Aviv   # comma-separated, as in cities.json
        run: |
          python3 - <<'PY'
          import os, shutil
          from storage import LAYER_SCALE, TILE, owners
          repo, cells = {c.strip() for c in os.environ["REPO_CITIES"].split(",")}, owners("cities.json")
          for layer in ["buildings"]:
              names = sorted(os.listdir(os.path.join("tiles", layer)))
              kept = [n for n in names if (m := TILE.match(f"tiles/{layer}/{n}")) and cells[LAYER_SCALE[layer]].get((int(m[2]), int(m[3]))) in repo]
              os.makedirs(os.path.join("out", layer), exist_ok=True)
              for n in kept: shutil.copy2(os.path.join("tiles", layer, n), os.path.join("out", layer, n))
              print(f"{layer}: {len(kept)} of {len(names)} committed tiles uploaded")
          PY
          # Two statements: a failure on the left of && does not stop a bash -e step, and out/buildings/ went up.
          python3 buildings_v2.py out/buildings out/buildings-v2   # the committed tiles, in the app's v2 format only
          rm -rf out/buildings
      - run: python3 coverage.py --out out --cities cities.json --previous "https://tiles.alephb.uk/coverage.json" --fragment fragment.json
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: "10"
        run: |
          find out -name '*.json' -print0 | xargs -0 -P4 -n200 gzip -9n
          find out -name '*.json.gz' | while read -r f; do mv "$f" "${f%.gz}"; done
          # Same as the build's upload: R2 refuses a few PUTs even with retries (repo_upload, 2026-10-07);
          # those files alone go up again, one at a time; anything else fails the step.
          up() { aws s3 cp "$@" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --content-encoding gzip --cache-control "public, max-age=86400"; }
          up out "s3://${{ secrets.R2_BUCKET }}/tiles/" --recursive > upload.log 2>&1 && exit 0
          cat upload.log
          grep -q '^upload failed: out/' upload.log || exit 1
          grep -v '^upload failed: out/' upload.log | grep -q . && exit 1
          sed -n 's/^upload failed: \(out\/[^ ]*\) to .*/\1/p' upload.log | while read -r f; do
            sleep 2; up "$f" "s3://${{ secrets.R2_BUCKET }}/tiles/${f#out/}" || exit 1
          done
      # After the upload, as in build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fragment-repo
          path: fragment.json
          retention-days: 3

  # The coverage feed the site's map reads: every job's fragment merged into the published feed, once.
  feed:
    needs: [plan, build, build_b, repo_upload]
    # Not when the plan failed or chose no city: nothing new to merge.
    if: ${{ !cancelled() && !inputs.dry_run && needs.plan.result == 'success' && (needs.plan.outputs.cities != '[]' || inputs.repo_tiles) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fragment-*
          path: fragments
      - run: python3 coverage.py --fragments fragments --cities cities.json --previous "https://tiles.alephb.uk/coverage.json" --write out-coverage.json --slim slim
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # config.json at the store's root, read by the app; the feed and the areas behind it, plain JSON for the site's map.
          aws s3 cp config.json "s3://${{ secrets.R2_BUCKET }}/config.json" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=3600"
          aws s3 cp out-coverage.json "s3://${{ secrets.R2_BUCKET }}/coverage.json" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"
          aws s3 cp cities.json "s3://${{ secrets.R2_BUCKET }}/cities.json" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"
          # The site's slim copies: the 1° squares first (a square gone from the feed leaves the store), then the index naming them.
          aws s3 sync slim/coverage "s3://${{ secrets.R2_BUCKET }}/coverage" --delete --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"
          aws s3 cp slim/areas.json "s3://${{ secrets.R2_BUCKET }}/areas.json" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"
          aws s3 cp slim/summary.json "s3://${{ secrets.R2_BUCKET }}/summary.json" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"
      # The store's numbers for the site's overview page: size and file count per layer (the bucket listed in
      # parallel ranges, about 2,500 list requests) and this run's build durations per city. Never fails the feed.
      - name: Stats
        continue-on-error: true
        timeout-minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 stats.py --bucket "${{ secrets.R2_BUCKET }}" --endpoint "$ENDPOINT" --cities cities.json \
            --previous "https://tiles.alephb.uk/stats.json" --run "${{ github.run_id }}" --repo "${{ github.repository }}" --write stats.json
          aws s3 cp stats.json "s3://${{ secrets.R2_BUCKET }}/stats.json" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"
