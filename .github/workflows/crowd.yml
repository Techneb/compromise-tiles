# Weekly crowd export (crowd.py): every Correction and SunReport record of the app's public CloudKit
# database, read with a server-to-server key. Uploads the ODbL export (crowd/facts.csv, crowd/model-check.json,
# crowd/LICENCE.txt) to the tile store and the raw archive (facts.csv, dated copy too) to a private bucket.
# Secrets: CLOUDKIT_KEY_ID, CLOUDKIT_PRIVATE_KEY (the PEM) — without them the run says so and stops, green;
# the tile store's as tiles.yml; R2_PRIVATE_BUCKET, R2_PRIVATE_ACCESS_KEY_ID, R2_PRIVATE_SECRET_ACCESS_KEY
# (a token for the private bucket only, same account) — without them the archive is skipped.
# A failed archive upload stops the run before the public files are written. Public repo, standard runner: no minutes are billed.
name: Crowd export

on:
  schedule:
    - cron: "47 2 * * 1"   # Mondays 02:47 UTC
  workflow_dispatch:

concurrency:
  group: crowd
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Which secrets are set (their values stay in env, never in the script's text or the log).
      - id: secrets
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$CLOUDKIT_KEY_ID" ] && [ -n "$CLOUDKIT_PRIVATE_KEY" ]; then echo "cloudkit=true" >> "$GITHUB_OUTPUT"
          else echo "CLOUDKIT_KEY_ID or CLOUDKIT_PRIVATE_KEY is not set: nothing to export." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$R2_PRIVATE_BUCKET" ] && [ -n "$R2_PRIVATE_ACCESS_KEY_ID" ] && [ -n "$R2_PRIVATE_SECRET_ACCESS_KEY" ]; then echo "private=true" >> "$GITHUB_OUTPUT"
          else echo "R2_PRIVATE_BUCKET or its token is not set: the private archive is skipped." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$R2_BUCKET" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.secrets.outputs.cloudkit == 'true'
      - if: steps.secrets.outputs.cloudkit == 'true'
        run: python3 -m pip install --user --break-system-packages -q "cryptography==44.0.3"
      - name: Export
        if: steps.secrets.outputs.cloudkit == 'true'
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
        run: |
          python3 crowd.py export --out crowd-out --config config.json | tee -a "$GITHUB_STEP_SUMMARY"
          test -f crowd-out/private/facts.csv
      # The archive first: a public export is never written that the archive could not restore.
      - name: Private archive
        if: steps.secrets.outputs.cloudkit == 'true' && steps.secrets.outputs.private == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          for key in facts.csv "archive/facts-$(date -u +%F).csv"; do
            aws s3 cp crowd-out/private/facts.csv "s3://${{ secrets.R2_PRIVATE_BUCKET }}/$key" --only-show-errors \
              --endpoint-url "$ENDPOINT" --content-type text/csv
          done
      - name: Public export
        if: steps.secrets.outputs.cloudkit == 'true' && steps.secrets.outputs.public == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp crowd-out/public/facts.csv "s3://${{ secrets.R2_BUCKET }}/crowd/facts.csv" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type "text/csv; charset=utf-8" --cache-control "public, max-age=3600"
          aws s3 cp crowd-out/public/model-check.json "s3://${{ secrets.R2_BUCKET }}/crowd/model-check.json" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=3600"
          aws s3 cp crowd-out/public/LICENCE.txt "s3://${{ secrets.R2_BUCKET }}/crowd/LICENCE.txt" --only-show-errors --endpoint-url "$ENDPOINT" \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=86400"
