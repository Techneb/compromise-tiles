# Weekly crowd export (crowd.py): every Correction and SunReport record of the app's public CloudKit
# database, read with a server-to-server key. Uploads the ODbL file (crowd/odbl/latest.csv.gz and a dated
# copy) to the tile store, and the archive (archive/<day>/) to the private bucket, pruned to its retention.
# Secrets: CLOUDKIT_KEY_ID, CLOUDKIT_PRIVATE_KEY (the PEM): without them the run says so and stops, green.
# The tile store's as tiles.yml. CROWD_ARCHIVE_SALT, R2_PRIVATE_ACCESS_KEY_ID, R2_PRIVATE_SECRET_ACCESS_KEY
# (a token for the private bucket only, same account): without them the archive is skipped.
# A failed archive upload stops the run before the public file is written. Public repo, standard runner: no minutes are billed.
name: Crowd export

on:
  schedule:
    - cron: "47 2 * * 1"   # Mondays 02:47 UTC
  workflow_dispatch:

concurrency:
  group: crowd
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  ARCHIVE: s3://compromise-crowd-archive/archive

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Which secrets are set (their values stay in env, never in the script's text or the log).
      - id: secrets
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CROWD_ARCHIVE_SALT: ${{ secrets.CROWD_ARCHIVE_SALT }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$CLOUDKIT_KEY_ID" ] && [ -n "$CLOUDKIT_PRIVATE_KEY" ]; then echo "cloudkit=true" >> "$GITHUB_OUTPUT"
          else echo "CLOUDKIT_KEY_ID or CLOUDKIT_PRIVATE_KEY is not set: nothing to export." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$CROWD_ARCHIVE_SALT" ] && [ -n "$R2_PRIVATE_ACCESS_KEY_ID" ] && [ -n "$R2_PRIVATE_SECRET_ACCESS_KEY" ]; then echo "private=true" >> "$GITHUB_OUTPUT"
          else echo "CROWD_ARCHIVE_SALT or the private bucket's token is not set: the archive is skipped." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$R2_BUCKET" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.cloudkit == 'true'
      - if: steps.secrets.outputs.cloudkit == 'true'
        run: python3 -m pip install --user --break-system-packages -q "cryptography==44.0.3"
      - name: Export
        if: steps.secrets.outputs.cloudkit == 'true'
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
          # Only when the archive can be uploaded: no salted copy is written that would not be kept.
          CROWD_ARCHIVE_SALT: ${{ steps.secrets.outputs.private == 'true' && secrets.CROWD_ARCHIVE_SALT || '' }}
        run: |
          python3 crowd.py export --out crowd-out --config config.json --cities cities.json | tee -a "$GITHUB_STEP_SUMMARY"
          test -f crowd-out/public/latest.csv.gz
      # The archive first: a public file is never written that the archive could not restore.
      - name: Private archive
        if: steps.secrets.outputs.cloudkit == 'true' && steps.secrets.outputs.private == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          day="$(ls crowd-out/private)"
          aws s3 cp "crowd-out/private/$day" "$ARCHIVE/$day" --recursive --only-show-errors --endpoint-url "$ENDPOINT"
          # Retention (crowd.py prune): the last 12 weekly snapshots, then the first of each month for 24 months.
          aws s3 ls "$ARCHIVE/" --endpoint-url "$ENDPOINT" | python3 crowd.py prune | while read -r old; do
            aws s3 rm "$ARCHIVE/$old/" --recursive --only-show-errors --endpoint-url "$ENDPOINT"
          done
      - name: Public ODbL file
        if: steps.secrets.outputs.cloudkit == 'true' && steps.secrets.outputs.public == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for f in crowd-out/public/*.csv.gz; do
            aws s3 cp "$f" "s3://${{ secrets.R2_BUCKET }}/crowd/odbl/$(basename "$f")" --only-show-errors --endpoint-url "$ENDPOINT" \
              --content-type application/gzip --cache-control "public, max-age=3600"
          done
