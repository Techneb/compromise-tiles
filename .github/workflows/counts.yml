# Per-city counts from OpenStreetMap extracts (going-out cells, terrace share); writes no tiles.
# Uploads counts.json to the store's root. Secrets as tiles.yml. Public repo, standard runner:
# no minutes are billed. Four jobs count a share of the extracts each (--part k/4: one job over the
# 306 listed cities took 4 h 30 of its 350 minutes on 2026-09-29, and the list grows), then `publish`
# merges them (--merge) with the published rows of the cities not counted. A run over
# survey-candidates.json (the cities not listed yet, candidates.py) uploads nothing: its rows are in
# the artifact and in the log (ROW lines), and `candidates.py merge` copies them into that file.
name: Counts

# On dispatch only since 2026-10-15 (no new cities): a tiled city's going-out cells come from the tile build's summary.json;
# this count is still the only one over a municipality only part tiled, and over the candidates.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Cities to count (comma-separated names; empty: all)"
        default: ""
      cities:
        description: "The list to count"
        type: choice
        options: [counts-cities.json, survey-candidates.json]
        default: counts-cities.json

concurrency:
  group: counts-${{ inputs.cities }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CITIES: ${{ inputs.cities || 'counts-cities.json' }}

jobs:
  counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: for i in 1 2 3; do timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update -q && timeout 600 sudo apt-get install -yq osmium-tool && break; [ $i = 3 ] && exit 1; sleep 30; done
      # --drop: each extract is deleted once its cities are counted, the runner's disk is small.
      - env:
          ONLY: ${{ inputs.only }}   # through env, not the script's text: a quote in it would run as shell
        run: python3 counts.py --cities "$CITIES" --part "${{ matrix.part }}/4" --extracts extracts --write counts.json --drop --only "$ONLY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counts-part-${{ matrix.part }}
          path: counts.json

  publish:
    needs: counts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: counts-part-*
          path: parts
      # --previous: a run given `only` keeps the published rows of the listed cities it did not count.
      - run: python3 counts.py --cities "$CITIES" --write counts.json --merge parts/*/counts.json --previous "https://tiles.alephb.uk/counts.json"
      - name: Upload to R2
        # Only the listed cities: the published file is what the cities page reads.
        if: ${{ env.CITIES == 'counts-cities.json' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp counts.json "s3://${{ secrets.R2_BUCKET }}/counts.json" --only-show-errors \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=300"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counts
          path: |
            counts.csv
            counts.json
