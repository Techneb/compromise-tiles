# Per-city counts from OpenStreetMap extracts (going-out cells, terrace share); writes no tiles.
# Uploads counts.json to the store's root. Secrets as tiles.yml. Public repo, standard runner:
# no minutes are billed. A run over survey-candidates.json (the cities not listed yet, candidates.py)
# or over one part uploads nothing: its rows are in the log and the artifact, and `candidates.py merge`
# copies them into survey-candidates.json.
name: Counts

on:
  schedule:
    - cron: "11 5 3 * *"   # the 3rd of each month, 05:11 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Cities to count (comma-separated names; empty: all)"
        default: ""
      cities:
        description: "The list to count"
        type: choice
        options: [counts-cities.json, survey-candidates.json]
        default: counts-cities.json
      part:
        description: "k/n: the k-th share of the extracts only (empty: all); a part uploads nothing"
        default: ""

concurrency:
  group: counts-${{ inputs.cities }}-${{ inputs.part }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq osmium-tool
      # --drop: each extract is deleted once its cities are counted, the runner's disk is small.
      # --previous: a run given `only` keeps the published rows of the cities it did not count.
      - run: python3 counts.py --cities "${{ inputs.cities || 'counts-cities.json' }}" --part "${{ inputs.part }}" --extracts extracts --write counts.json --drop --only "${{ inputs.only }}" --previous "https://tiles.alephb.uk/counts.json"
      - name: Upload to R2
        # Only the listed cities, all of them: the published file is what the cities page reads.
        if: ${{ (inputs.cities || 'counts-cities.json') == 'counts-cities.json' && !inputs.part }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp counts.json "s3://${{ secrets.R2_BUCKET }}/counts.json" --only-show-errors \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=300"
      - uses: actions/upload-artifact@v4
        with:
          name: counts
          path: |
            counts.csv
            counts.json
