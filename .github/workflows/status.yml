# The cities status feed (cities-status.json, read by the site's cities page) regenerated from the private list of
# cities and the store's summary.json, then committed here when it changed and copied to the store (tiles.alephb.uk)
# beside areas.json, where the pages read it first. After every Tiles run, daily, or by hand.
# Needs APP_REPO_TOKEN: a fine-grained token with read access to the private repository's contents; without it the
# run says so and stops green (the feed is then regenerated by hand, as before). dry_run prints the change, commits nothing.
name: Status

on:
  workflow_run:
    workflows: [Tiles]
    types: [completed]
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would change; commit nothing"
        type: boolean
        default: false

concurrency:
  group: status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No APP_REPO_TOKEN: nothing regenerated." | tee -a "$GITHUB_STEP_SUMMARY"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ steps.token.outputs.ok == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ steps.token.outputs.ok == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Techneb/compromise
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          sparse-checkout: |
            docs/sunny-filter
            tools/coverage
            MeetCore/Sources/MeetCore/ListingLinks.swift
            MeetCore/Sources/MeetCore/ListingSites*.swift
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - if: ${{ steps.token.outputs.ok == 'true' }}
        run: |
          python3 -I app/tools/coverage/cities_status.py --csv app/docs/sunny-filter/cities.csv --points counts-cities.json \
            --candidates survey-candidates.json --listings app/MeetCore/Sources/MeetCore/ListingLinks.swift --write cities-status.json
          rm -rf app
          git diff --stat -- cities-status.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ steps.token.outputs.ok == 'true' && !inputs.dry_run }}
        run: |
          git diff --quiet -- cities-status.json && exit 0
          git config user.name Techneb
          git config user.email contact@alephb.uk
          git commit -qm "cities-status.json regenerated [skip ci]" -- cities-status.json
          git push -q origin HEAD:master
      - if: ${{ steps.token.outputs.ok == 'true' && !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp cities-status.json "s3://${{ secrets.R2_BUCKET }}/cities-status.json" --only-show-errors \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=300"
